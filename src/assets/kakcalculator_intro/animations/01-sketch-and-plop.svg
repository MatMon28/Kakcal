<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>
    /* --- 01: SKETCH &amp; PLOP (1150ms) --- */
        .s1-card { animation: s1-card-anim 1150ms linear both; }
        .s1-stem { stroke-dasharray: 262 600; animation: s1-stem-anim 1150ms linear both; }
        .s1-upper { stroke-dasharray: 204 600; animation: s1-upper-anim 1150ms linear both; }
        .s1-lower { stroke-dasharray: 185 600; animation: s1-lower-anim 1150ms linear both; }
        .s1-poop { animation: s1-poop-anim 1150ms linear both; }
        .s1-c-bot { stroke-dasharray: 36 100; animation: s1-c-bot-anim 1150ms linear both; }
        .s1-c-mid { stroke-dasharray: 24 100; animation: s1-c-mid-anim 1150ms linear both; }
        .s1-c-top { stroke-dasharray: 14 100; animation: s1-c-top-anim 1150ms linear both; }
    
        @keyframes s1-card-anim {
          0% { opacity: 0; transform: scale(0.74); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          24% { opacity: 1; transform: scale(1.018); animation-timing-function: ease-out; }
          40% { transform: translate(0px, 0px) scale(1, 1); }
          50% { transform: translate(0px, 0px) scale(1, 1); animation-timing-function: cubic-bezier(0.25, 0.8, 0.4, 1); }
          57% { transform: translate(0px, 5px) scale(1.012, 0.988); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
          74% { transform: translate(0px, -1.5px) scale(0.997, 1.003); }
          90%, 100% { opacity: 1; transform: translate(0px, 0px) scale(1, 1); }
        }
        @keyframes s1-stem-anim {
          0%, 9% { opacity: 0; stroke-width: 0; stroke-dashoffset: 262; animation-timing-function: ease-out; }
          14% { opacity: 1; stroke-width: 96; stroke-dashoffset: 215; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          34%, 100% { opacity: 1; stroke-width: 96; stroke-dashoffset: 0; }
        }
        @keyframes s1-upper-anim {
          0%, 21% { opacity: 0; stroke-width: 0; stroke-dashoffset: 204; animation-timing-function: ease-out; }
          26% { opacity: 1; stroke-width: 96; stroke-dashoffset: 165; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          45%, 100% { opacity: 1; stroke-width: 96; stroke-dashoffset: 0; }
        }
        @keyframes s1-lower-anim {
          0%, 31% { opacity: 0; stroke-width: 0; stroke-dashoffset: 185; animation-timing-function: ease-out; }
          36% { opacity: 1; stroke-width: 96; stroke-dashoffset: 148; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          53%, 100% { opacity: 1; stroke-width: 96; stroke-dashoffset: 0; }
        }
        @keyframes s1-poop-anim {
          0%, 42% { opacity: 0; transform: translate(0px, -145px) scale(0.76, 1.24); animation-timing-function: cubic-bezier(0.55, 0.05, 0.85, 0.35); }
          46% { opacity: 1; transform: translate(0px, -95px) scale(0.82, 1.2); animation-timing-function: cubic-bezier(0.55, 0.08, 0.85, 0.45); }
          56% { opacity: 1; transform: translate(0px, 4px) scale(1.26, 0.72); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          68% { transform: translate(0px, -14px) scale(0.89, 1.13); animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
          79% { transform: translate(0px, 1.5px) scale(1.06, 0.95); animation-timing-function: ease-out; }
          89% { transform: translate(0px, 0px) scale(0.985, 1.015); }
          100% { opacity: 1; transform: translate(0px, 0px) scale(1, 1); }
        }
        @keyframes s1-c-bot-anim {
          0%, 52% { stroke-dashoffset: 36; opacity: 0; }
          56% { opacity: 1; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          70%, 100% { stroke-dashoffset: 0; opacity: 1; }
        }
        @keyframes s1-c-mid-anim {
          0%, 57% { stroke-dashoffset: 24; opacity: 0; }
          61% { opacity: 1; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          75%, 100% { stroke-dashoffset: 0; opacity: 1; }
        }
        @keyframes s1-c-top-anim {
          0%, 62% { stroke-dashoffset: 14; opacity: 0; }
          66% { opacity: 1; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          80%, 100% { stroke-dashoffset: 0; opacity: 1; }
        }
  </style>
              <defs>
                <clipPath id="s1-s1-clip">
                  <rect x="8" y="8" width="496" height="496" rx="116" />
                </clipPath>
              </defs>
              <g transform="translate(256 256)">
                <g class="s1-card">
                  <g transform="translate(-256 -256)">
                    <rect x="8" y="8" width="496" height="496" rx="116" fill="var(--kc-cream, #FBF3E3)" />
                    <g clip-path="url(#s1-s1-clip)">
                      <g fill="none" stroke="var(--kc-ink, #232325)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round">
                        <path class="s1-stem" d="M148 132 V392" />
                        <path class="s1-upper" d="M156 268 L304 132" />
                        <path class="s1-lower" d="M196 252 L312 392" />
                      </g>
                      <g transform="translate(365.2 441.6)">
                        <g class="s1-poop">
                          <g transform="translate(-365.2 -441.6)">
                            <g transform="translate(274 282) scale(2.85)" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M32 5 C37 9 39 12.5 36.5 15.5 C41 16 44 18.5 44 22.5 C44 25 43 27 42 28 C46.5 28.5 50 31.5 50 35 C50 37.5 49 39.5 48 41 C52.5 41.5 56 44.5 56 48 C56 52.5 52.5 56 48 56 H16 C11.5 56 8 52.5 8 48 C8 44.5 11.5 41.5 16 41 C15 39.5 14 37.5 14 35 C14 31.5 17.5 28.5 22 28 C21 27 20 25 20 22.5 C20 18.5 23 16 27.5 15.5 C25 12.5 27 9 32 5Z" fill="var(--kc-cream, #FBF3E3)" stroke="var(--kc-cream, #FBF3E3)" stroke-width="9.5" />
                              <g fill="none" stroke="var(--kc-ink, #232325)" stroke-width="3.5">
                                <path d="M32 5 C37 9 39 12.5 36.5 15.5 C41 16 44 18.5 44 22.5 C44 25 43 27 42 28 C46.5 28.5 50 31.5 50 35 C50 37.5 49 39.5 48 41 C52.5 41.5 56 44.5 56 48 C56 52.5 52.5 56 48 56 H16 C11.5 56 8 52.5 8 48 C8 44.5 11.5 41.5 16 41 C15 39.5 14 37.5 14 35 C14 31.5 17.5 28.5 22 28 C21 27 20 25 20 22.5 C20 18.5 23 16 27.5 15.5 C25 12.5 27 9 32 5Z" />
                                <path class="s1-c-top" d="M27.5 15.5 Q32 18 36.5 15.5" />
                                <path class="s1-c-mid" d="M22 28 Q32 31.5 42 28" />
                                <path class="s1-c-bot" d="M16 41 Q32 45.5 48 41" />
                              </g>
                            </g>
                          </g>
                        </g>
                      </g>
                    </g>
                  </g>
                </g>
              </g>
            </svg>

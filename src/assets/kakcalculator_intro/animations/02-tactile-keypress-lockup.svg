      <path d="M196 252 L312 392" />
    
            </g>
            <g class="lk-poop" transform="translate(505.075 270.575) scale(1.959375) translate(-32 -32)" stroke-linecap="round" stroke-linejoin="round">
              
      <path d="M32 5 C37 9 39 12.5 36.5 15.5 C41 16 44 18.5 44 22.5 C44 25 43 27 42 28 C46.5 28.5 50 31.5 50 35 C50 37.5 49 39.5 48 41 C52.5 41.5 56 44.5 56 48 C56 52.5 52.5 56 48 56 H16 C11.5 56 8 52.5 8 48 C8 44.5 11.5 41.5 16 41 C15 39.5 14 37.5 14 35 C14 31.5 17.5 28.5 22 28 C21 27 20 25 20 22.5 C20 18.5 23 16 27.5 15.5 C25 12.5 27 9 32 5Z" fill="var(--kc-cream, #FBF3E3)" stroke="var(--kc-cream, #FBF3E3)" stroke-width="9.5" />
      <g fill="none" stroke="var(--kc-ink, #232325)" stroke-width="3.5">
        <path d="M32 5 C37 9 39 12.5 36.5 15.5 C41 16 44 18.5 44 22.5 C44 25 43 27 42 28 C46.5 28.5 50 31.5 50 35 C50 37.5 49 39.5 48 41 C52.5 41.5 56 44.5 56 48 C56 52.5 52.5 56 48 56 H16 C11.5 56 8 52.5 8 48 C8 44.5 11.5 41.5 16 41 C15 39.5 14 37.5 14 35 C14 31.5 17.5 28.5 22 28 C21 27 20 25 20 22.5 C20 18.5 23 16 27.5 15.5 C25 12.5 27 9 32 5Z" />
        <path d="M27.5 15.5 Q32 18 36.5 15.5" />
        <path d="M22 28 Q32 31.5 42 28" />
        <path d="M16 41 Q32 45.5 48 41" />
      </g>
    
            </g>
            <g class="lk-word" fill="var(--kc-ink, #232325)">
              <text x="272" y="226" textLength="552" lengthAdjust="spacingAndGlyphs" font-family="'Nunito', 'Quicksand', 'Rubik', 'Varela Round', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-2px">kcalculator</text>
            </g>
          </g>
          <g class="lk-icon" transform="translate(254 14) scale(0.6875)">

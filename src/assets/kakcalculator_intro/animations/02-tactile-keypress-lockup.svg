<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" class="lockup" style="--lk-d:1380ms">
  <style>
    /* --- 02: TACTILE KEYPRESS (1120ms) --- */
        .s2-rig { animation: s2-rig-anim 1120ms linear both; }
        .s2-skirt { animation: s2-skirt-anim 1120ms linear both; }
        .s2-cap { animation: s2-cap-anim 1120ms linear both; }
        .s2-k { animation: s2-k-anim 1120ms linear both; }
        .s2-poop { animation: s2-poop-anim 1120ms linear both; }
        .s2-ray { stroke-dasharray: 32 80; animation: s2-ray-anim 1120ms linear both; }
    
        @keyframes s2-rig-anim {
          0% { opacity: 0; transform: scale(0.78); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          20% { opacity: 1; transform: scale(0.91); }
          72% { transform: scale(0.91); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          92%, 100% { opacity: 1; transform: scale(1); }
        }
        @keyframes s2-skirt-anim {
          0% { opacity: 0; transform: translate(0px, 0px); animation-timing-function: ease-out; }
          18%, 62% { opacity: 1; transform: translate(0px, 16px); }
          80%, 100% { opacity: 0; transform: translate(0px, 0px); }
        }
        @keyframes s2-cap-anim {
          0% { transform: translate(0px, 0px); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          20% { transform: translate(0px, -14px); animation-timing-function: ease-in-out; }
          31% { transform: translate(0px, -18px); animation-timing-function: cubic-bezier(0.65, 0, 0.9, 1); }
          42% { transform: translate(0px, 14px); }
          50% { transform: translate(0px, 14px); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
          66% { transform: translate(0px, -6px); animation-timing-function: ease-out; }
          84%, 100% { transform: translate(0px, 0px); }
        }
        @keyframes s2-k-anim {
          0%, 6% { opacity: 0; transform: scale(0.88); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          22%, 38% { opacity: 1; transform: scale(1); }
          43% { transform: scale(1.045, 0.96); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
          62%, 100% { opacity: 1; transform: scale(1, 1); }
        }
        @keyframes s2-poop-anim {
          0%, 48% { opacity: 0; transform: scale(0) rotate(-18deg); animation-timing-function: cubic-bezier(0.22, 1.4, 0.36, 1); }
          52% { opacity: 1; }
          65% { opacity: 1; transform: scale(1.16) rotate(6deg); animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
          78% { transform: scale(0.95) rotate(-2.5deg); animation-timing-function: ease-out; }
          89% { transform: scale(1.02) rotate(0.8deg); }
          100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes s2-ray-anim {
          0%, 51% { opacity: 0; stroke-dashoffset: 32; }
          55% { opacity: 1; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          68% { opacity: 1; stroke-dashoffset: 0; animation-timing-function: ease-in; }
          82%, 100% { opacity: 0; stroke-dashoffset: -32; }
        }
    
    /* ==========================================================================
           PHASE 2 — BRAND LOCKUP (shared by every animation)
           The brand layer sits ON TOP of the running animation but is fully transparent
           until the launch animation has settled. At that instant the icon and the brand
           layer are pixel-identical, so the hand-off is invisible — then the K and the
           swirl walk out of the icon and become part of the app name.
           ========================================================================== */
        .lockup .lk-brand { animation: lk-brand-in 1500ms linear var(--lk-d, 1400ms) both; }
        .lockup .lk-icon { animation: lk-icon-out 1500ms linear var(--lk-d, 1400ms) both; }
        .lockup .lk-plate { animation: lk-plate-morph 1500ms linear var(--lk-d, 1400ms) both; }
        .lockup .lk-k { animation: lk-k-move 1500ms linear var(--lk-d, 1400ms) both; }
        .lockup .lk-poop { animation: lk-poop-move 1500ms linear var(--lk-d, 1400ms) both; }
        .lockup .lk-word { animation: lk-word-in 1500ms linear var(--lk-d, 1400ms) both; }
    
        /* Deterministic SVG transform space (never rely on default transform-origin) */
        .lockup .lk-k,
        .lockup .lk-poop {
          transform-box: view-box;
          transform-origin: 0 0;
        }
    
        /* Invisible during the whole launch animation, then snapped on in one frame.
           Both layers are identical at that moment, so nothing can be seen. */
        @keyframes lk-brand-in {
          0%, 1% { opacity: 0; }
          1.8%, 100% { opacity: 1; }
        }
        /* Faded out BEHIND the opaque brand plate — never visible to the eye */
        @keyframes lk-icon-out {
          0%, 2% { opacity: 1; }
          9%, 100% { opacity: 0; }
        }
        /* Squircle -> wordmark banner. Attributes carry the exact final geometry as a
           fallback; the keyframes morph it out of the icon's squircle (identical centre). */
        @keyframes lk-plate-morph {
          0%, 1.8% { x: 259.5px; y: 19.5px; width: 341px; height: 341px; rx: 79.75px; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          7% { x: 239px; y: -1px; width: 382px; height: 382px; rx: 92px; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          46% { x: 13px; y: 57px; width: 834px; height: 266px; rx: 47px; }
          62% { x: 18px; y: 61px; width: 824px; height: 258px; rx: 44px; }
          74%, 100% { x: 20px; y: 60px; width: 820px; height: 260px; rx: 42px; }
        }
        /* Straight out of the icon, easing into the wordmark's K slot */
        @keyframes lk-k-move {
          0%, 7% { transform: translate(254px, 14px) scale(0.6875); animation-timing-function: cubic-bezier(0.4, 0, 0.25, 1); }
          50% { transform: translate(47px, 53px) scale(0.537); }
          64% { transform: translate(34px, 60px) scale(0.516); }
          78%, 100% { transform: translate(38px, 58px) scale(0.52); }
        }
        /* Hops across on an arc, squash-and-stretch landing next to the K */
        @keyframes lk-poop-move {
          0%, 8% { transform: translate(505.075px, 270.575px) scale(1.959375) rotate(0deg) translate(-32px, -32px); animation-timing-function: cubic-bezier(0.34, 0, 0.5, 1); }
          30% { transform: translate(392px, 148px) scale(1.6) rotate(-17deg) translate(-32px, -32px); animation-timing-function: ease-in-out; }
          46% { transform: translate(238.4px, 170px) scale(1.55) rotate(10deg) translate(-32px, -32px); animation-timing-function: cubic-bezier(0.34, 1.5, 0.5, 1); }
          60% { transform: translate(238.4px, 191px) scale(1.43, 1.49) rotate(-3deg) translate(-32px, -32px); }
          72%, 100% { transform: translate(238.4px, 186.4px) scale(1.45) rotate(0deg) translate(-32px, -32px); }
        }
        @keyframes lk-word-in {
          0%, 44% { opacity: 0; transform: translate(0px, 17px); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          50% { opacity: 1; }
          74%, 100% { opacity: 1; transform: translate(0px, 0px); }
        }
  </style>
          <g class="lk-brand">
            <rect class="lk-plate" x="20" y="60" width="820" height="260" rx="42" fill="var(--kc-cream, #FBF3E3)" />
            <g class="lk-k" transform="translate(254 14) scale(0.6875)" fill="none" stroke="var(--kc-ink, #232325)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round">
              
      <path d="M148 132 V392" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>
    /* --- 05: FLUSH VORTEX SPIN (1220ms) --- */
        .s5-card { animation: s5-card-anim 1220ms linear both; }
        .s5-vortex-a { animation: s5-vortex-a-anim 1220ms linear both; }
        .s5-vortex-b { animation: s5-vortex-b-anim 1220ms linear both; }
        .s5-k { animation: s5-k-anim 1220ms linear both; }
        .s5-poop { animation: s5-poop-anim 1220ms linear both; }
    
        @keyframes s5-card-anim {
          0% { opacity: 0; transform: scale(0.56) rotate(-26deg); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          26%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes s5-vortex-a-anim {
          0%, 5% { opacity: 0; transform: translate(0px, 0px) scale(1.2) rotate(0deg); }
          18% { opacity: 0.2; }
          70%, 100% { opacity: 0; transform: translate(96px, 104px) scale(0.14) rotate(340deg); }
        }
        @keyframes s5-vortex-b-anim {
          0%, 10% { opacity: 0; transform: translate(0px, 0px) scale(1.15) rotate(-40deg); }
          24% { opacity: 0.26; }
          74%, 100% { opacity: 0; transform: translate(96px, 104px) scale(0.1) rotate(300deg); }
        }
        @keyframes s5-k-anim {
          0%, 8% { opacity: 0; transform: scale(0.28) rotate(-155deg); animation-timing-function: cubic-bezier(0.22, 1.25, 0.36, 1); }
          16% { opacity: 1; }
          60% { opacity: 1; transform: scale(1.04) rotate(7deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
          78% { transform: scale(0.985) rotate(-2deg); animation-timing-function: ease-out; }
          92%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes s5-poop-anim {
          0%, 38% { opacity: 0; transform: scale(0) rotate(-240deg); animation-timing-function: cubic-bezier(0.22, 1.36, 0.36, 1); }
          44% { opacity: 1; }
          74% { opacity: 1; transform: scale(1.15) rotate(11deg); animation-timing-function: ease-in-out; }
          87% { transform: scale(0.96) rotate(-3deg); animation-timing-function: ease-out; }
          100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
  </style>
              <defs>
                <clipPath id="s5-s5-clip">
                  <rect x="8" y="8" width="496" height="496" rx="116" />
                </clipPath>
              </defs>

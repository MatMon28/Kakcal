<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>
    /* --- 03: SWIRL &amp; UNFOLD (1280ms) --- */
        .s3-bg { animation: s3-bg-anim 1280ms linear both; }
        .s3-stem { animation: s3-stem-anim 1280ms linear both; }
        .s3-upper { animation: s3-upper-anim 1280ms linear both; }
        .s3-lower { animation: s3-lower-anim 1280ms linear both; }
        .s3-mascot { animation: s3-mascot-anim 1280ms linear both; }
        .s3-outline { stroke-dasharray: 185 400; animation: s3-outline-anim 1280ms linear both; }
    
        @keyframes s3-bg-anim {
          0% { opacity: 0; transform: scale(0.84); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          22%, 100% { opacity: 1; transform: scale(1); }
        }
        @keyframes s3-mascot-anim {
          0% { opacity: 0; transform: translate(-109.2px, -74px) scale(0.35) rotate(-14deg); animation-timing-function: cubic-bezier(0.22, 1.35, 0.36, 1); }
          18% { opacity: 1; transform: translate(-109.2px, -110px) scale(1.42) rotate(7deg); animation-timing-function: ease-in-out; }
          30% { transform: translate(-109.2px, -106.35px) scale(1.36) rotate(-6deg); animation-timing-function: ease-in-out; }
          38% { transform: translate(-109.2px, -106.35px) scale(1.38) rotate(4deg); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
          68% { transform: translate(7px, 5px) scale(1.06, 0.94) rotate(8deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
          83% { transform: translate(-2px, -2px) scale(0.98, 1.02) rotate(-2deg); animation-timing-function: ease-out; }
          94%, 100% { opacity: 1; transform: translate(0px, 0px) scale(1, 1) rotate(0deg); }
        }
        @keyframes s3-outline-anim {
          0%, 4% { stroke-dashoffset: 185; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          26%, 100% { stroke-dashoffset: 0; }
        }
        @keyframes s3-stem-anim {
          0%, 35% { opacity: 0; transform: scale(0.2, 0.05); animation-timing-function: cubic-bezier(0.22, 1.3, 0.36, 1); }
          40% { opacity: 1; }
          58% { opacity: 1; transform: scale(1, 1.04); animation-timing-function: ease-out; }
          74%, 100% { opacity: 1; transform: scale(1, 1); }
        }
        @keyframes s3-upper-anim {
          0%, 42% { opacity: 0; transform: rotate(-47.4deg) scale(0.62); animation-timing-function: cubic-bezier(0.22, 1.35, 0.36, 1); }
          46% { opacity: 1; }
          72% { opacity: 1; transform: rotate(3.8deg) scale(1.02); animation-timing-function: ease-out; }
          86%, 100% { opacity: 1; transform: rotate(0deg) scale(1); }
        }
        @keyframes s3-lower-anim {
          0%, 46% { opacity: 0; transform: translate(-48px, 0px) rotate(39.6deg) scale(0.68); animation-timing-function: cubic-bezier(0.22, 1.35, 0.36, 1); }
          50% { opacity: 1; }
          76% { opacity: 1; transform: translate(0px, 0px) rotate(-3.8deg) scale(1.02); animation-timing-function: ease-out; }
          90%, 100% { opacity: 1; transform: translate(0px, 0px) rotate(0deg) scale(1); }
        }
  </style>
              <g transform="translate(256 256)">
                <g class="s3-bg">
                  <g transform="translate(-256 -256)">
                    <rect x="8" y="8" width="496" height="496" rx="116" fill="var(--kc-cream, #FBF3E3)" />
                    <g fill="none" stroke="var(--kc-ink, #232325)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round">

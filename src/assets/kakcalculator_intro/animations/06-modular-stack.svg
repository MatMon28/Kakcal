<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>
    /* --- 06: MODULAR COIL STACK (1240ms) --- */
        .s6-card { animation: s6-card-anim 1240ms linear both; }
        .s6-bar-1 { animation: s6-bar1-anim 1240ms linear both; }
        .s6-bar-2 { animation: s6-bar2-anim 1240ms linear both; }
        .s6-bar-3 { animation: s6-bar3-anim 1240ms linear both; }
        .s6-wiper { animation: s6-wiper-anim 1240ms linear both; }
        .s6-stack-bounce { animation: s6-stack-bounce-anim 1240ms linear both; }
    
        @keyframes s6-card-anim {
          0% { opacity: 0; transform: scale(0.84); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          20%, 100% { opacity: 1; transform: scale(1); }
        }
        @keyframes s6-bar1-anim {
          0%, 8% { opacity: 0; transform: translate(0px, 340px); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          14% { opacity: 1; }
          40% { transform: translate(0px, -14px); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
          56%, 100% { opacity: 1; transform: translate(0px, 0px); }
        }
        @keyframes s6-bar2-anim {
          0%, 16% { opacity: 0; transform: translate(230px, -212px); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          22% { opacity: 1; }
          47% { transform: translate(-11px, 10px); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
          63%, 100% { opacity: 1; transform: translate(0px, 0px); }
        }
        @keyframes s6-bar3-anim {
          0%, 23% { opacity: 0; transform: translate(200px, 242px); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          29% { opacity: 1; }
          54% { transform: translate(-9px, -11px); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
          70%, 100% { opacity: 1; transform: translate(0px, 0px); }
        }
        @keyframes s6-wiper-anim {
          0%, 44% { transform: translate(0px, 74px); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          55% { transform: translate(0px, 50px); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          67% { transform: translate(0px, 37px); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          79% { transform: translate(0px, 24px); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
          91%, 100% { transform: translate(0px, 0px); }
        }
        @keyframes s6-stack-bounce-anim {
          0%, 44% { transform: scale(1, 1); }
          54% { transform: scale(1.1, 0.9); }
          61% { transform: scale(0.97, 1.04); }
          67% { transform: scale(1.08, 0.92); }
          74% { transform: scale(0.97, 1.04); }
          80% { transform: scale(1.06, 0.94); }
          89% { transform: scale(0.96, 1.06); }
          96%, 100% { transform: scale(1, 1); }
        }
  </style>
              <defs>
                <clipPath id="s6-s6-clip">
                  <rect x="8" y="8" width="496" height="496" rx="116" />
                </clipPath>
                <mask id="s6-s6-mask" maskUnits="userSpaceOnUse" x="-12" y="-12" width="88" height="88">
                  <g class="s6-wiper">
                    <rect x="-12" y="-12" width="88" height="88" fill="#ffffff" />
                  </g>
                </mask>
              </defs>
              <g transform="translate(256 256)">

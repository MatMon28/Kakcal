<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#EFE9DD" />
    <meta name="description" content="Kakcal — Daily Energy Intake & Expenditure Tracker" />
    <!-- pwa:start (browser/PWA only; scripts/prepare-android.mjs removes everything up to pwa:end) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kakcal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- pwa:end -->
        <title>Kakcal — Daily Nutrition &amp; Wellness</title>
    <style>
      /*
       * Boot layer: a plain full-screen layer in the app background colour, from the very first
       * paint until the app (and its launch animation) has mounted. It has no logo, so it matches
       * the Android launch screen and the animation is the first thing that appears. It sits above
       * the intro overlay and fades out over it (see src/components/intro/bootSplash.ts). The colour
       * is the theme token from the inlined stylesheet, with the Light palette as the fallback.
       */
      #kc-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483001;
        display: grid;
        place-items: center;
        background: var(--bg, #EFE9DD);
        color: var(--text, #232325);
        opacity: 1;
        transition: opacity 220ms ease-out;
        pointer-events: none;
      }
      #kc-boot[data-hidden] { opacity: 0; }
      html[data-boot="off"] #kc-boot { display: none; }
      @media (prefers-reduced-motion: reduce) { #kc-boot { transition: none; } }
    </style>
    <script>
      // No boot screen inside the tour's iframes, with ?intro=0 or with ?tour=1 (same rules as the intro).
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          if (window.parent !== window || q.get('intro') === '0' || q.get('tour') === '1') {
            document.documentElement.setAttribute('data-boot', 'off');
          }
        } catch (e) { /* keep the boot screen */ }
      })();
    </script>
    <script>
      // Apply the saved theme before the first paint. React sets data-theme after it mounts,
      // which left a light flash on every launch for Lite Dark / Dark users and made the
      // start look slower. The colours mirror --bg in src/index.css.
      (function () {
        try {
          var parsed = JSON.parse(localStorage.getItem('kcalsync_settings') || '{}');
          var theme = parsed.theme === 'dark' || parsed.theme === 'lite-dark' ? parsed.theme : 'light';
          var style = parsed.themeStyle || 'classic';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-style', style);
          if (theme !== 'light' && (style === 'classic' || style === 'minimal')) {
            var bg = style === 'minimal' ? (theme === 'dark' ? '#060911' : '#182232') : (theme === 'dark' ? '#13151A' : '#272A33');
            root.style.backgroundColor = bg;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', bg);
          }
        } catch (e) { /* storage may be unavailable; the app applies the theme after mount */ }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#C9EFD3] selection:text-[#164226] overflow-x-hidden">
    <div id="kc-boot" aria-hidden="true">
        <!-- kc-boot:start -->
        <!-- No logo on purpose: the boot layer is only the app background colour, so the launch animation is the first thing shown. -->
        <!-- kc-boot:end -->
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

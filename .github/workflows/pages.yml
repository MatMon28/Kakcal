
name: Deploy PWA

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch APK from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/downloads
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Kakcalculator.apk' \
            --dir public/downloads \
            || echo "No APK found; using fallback."
          # Validate the download: an APK is a ZIP. A broken or HTML file must never be published as the APK.
          if [ -f public/downloads/Kakcalculator.apk ]; then
            unzip -tq public/downloads/Kakcalculator.apk >/dev/null \
              && unzip -l public/downloads/Kakcalculator.apk | grep -q AndroidManifest.xml \
              || { echo "Downloaded APK is invalid; removing it."; rm -f public/downloads/Kakcalculator.apk; }
          fi

      - name: Build application
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

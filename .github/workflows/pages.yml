
name: Deploy PWA

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch APK from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/downloads
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Kakcalculator.apk' \
            --dir public/downloads \
            || echo "No APK found; using fallback."

      - run: npm ci && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

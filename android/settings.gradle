// =============================================================================
// PRE-FLIGHT CHECK: Capacitor's native Android modules live in node_modules/
// =============================================================================
// capacitor.settings.gradle (generated by `npx cap sync android`, applied at
// the bottom of this file) maps these Gradle subprojects to directories inside
// the ROOT node_modules/ folder, one level above android/:
//
//   :capacitor-android  ->  ../node_modules/@capacitor/android/capacitor
//   :capacitor-app      ->  ../node_modules/@capacitor/app/android
//
// When node_modules/ is missing or incomplete (fresh clone, copied/zipped
// folder, interrupted install, OneDrive/Dropbox "online-only" or excluded
// folders, ...) Gradle does NOT complain at this point. It silently creates
// empty placeholder subprojects with no build variants, and the build fails
// much later with a cryptic message such as:
//
//   No matching variant of project :capacitor-android was found.
//   No variants exist.
//
// This guard runs before any project is included and fails immediately with a
// human-readable explanation instead. Keep it ABOVE the `apply from:` line.
// =============================================================================

def projectRoot   = settingsDir.parentFile
def nodeModules   = new File(projectRoot, 'node_modules')

// Gradle subproject -> a file that must exist for that module to be buildable.
def requiredCapacitorModules = [
    ':capacitor-android': new File(nodeModules, '@capacitor/android/capacitor/build.gradle'),
    ':capacitor-app'    : new File(nodeModules, '@capacitor/app/android/build.gradle'),
]

def missingModules = requiredCapacitorModules.findAll { name, marker -> !marker.isFile() }

if (!missingModules.isEmpty()) {
    def lines = []
    lines << ''
    lines << '======================================================================='
    lines << ' Kakcalculator Android build cannot start:'
    lines << ' Capacitor native modules were not found in the root node_modules/.'
    lines << '======================================================================='
    lines << ''
    lines << ' Missing Gradle subproject source directories:'
    missingModules.each { name, marker ->
        lines << "   ${name.padRight(20)} -> ${marker.parentFile}"
    }
    lines << ''
    lines << " Project root         : ${projectRoot}"
    lines << " Expected node_modules: ${nodeModules}"
    lines << ''
    lines << ' HOW TO FIX - run from the PROJECT ROOT (one level above android/):'
    lines << ''
    lines << '     npm install            (or: npm ci, if package-lock.json is intact)'
    lines << '     npx cap sync android'
    lines << ''
    lines << '   or, as a single command:'
    lines << ''
    lines << '     npm run android:prepare'
    lines << ''
    lines << ' Then re-sync the android/ project in Android Studio, or run'
    lines << ' ./gradlew assembleDebug  (gradlew.bat assembleDebug on Windows).'
    lines << ''
    lines << ' Tip: if this folder is inside OneDrive/Dropbox, make sure node_modules/'
    lines << ' is fully downloaded locally (not "online-only") and not excluded.'
    lines << '======================================================================='
    throw new GradleException(lines.join(System.lineSeparator()))
}

// -----------------------------------------------------------------------------
// Same class of failure, second source: the Cordova compatibility module is
// generated by `npx cap sync android` and is git-ignored. Without it Gradle
// would again include an empty placeholder project (and app/capacitor.build.gradle
// could not apply ../capacitor-cordova-android-plugins/cordova.variables.gradle).
// -----------------------------------------------------------------------------
def cordovaPluginsDir = new File(settingsDir, 'capacitor-cordova-android-plugins')
def cordovaMarkers    = ['build.gradle', 'cordova.variables.gradle'].collect { new File(cordovaPluginsDir, it) }

if (cordovaMarkers.any { !it.isFile() }) {
    throw new GradleException([
        '',
        '=======================================================================',
        ' Kakcalculator Android build cannot start:',
        ' android/capacitor-cordova-android-plugins/ has not been generated.',
        '=======================================================================',
        '',
        " Expected directory: ${cordovaPluginsDir}",
        '',
        ' This module is created by Capacitor and is not committed to git.',
        ' HOW TO FIX - run from the PROJECT ROOT (one level above android/):',
        '',
        '     npx cap sync android        (requires node_modules/, see README)',
        '',
        '   or, as a single command that also builds the web assets:',
        '',
        '     npm run android:prepare',
        '=======================================================================',
    ].join(System.lineSeparator()))
}

// -----------------------------------------------------------------------------
// Soft check: the compiled web bundle. Its absence does not break the Gradle
// build, but the resulting APK would open an empty WebView, so warn loudly.
// -----------------------------------------------------------------------------
def webBundle = new File(settingsDir, 'app/src/main/assets/public/index.html')
if (!webBundle.isFile()) {
    logger.warn('')
    logger.warn('WARNING [Kakcalculator]: android/app/src/main/assets/public/index.html is missing.')
    logger.warn('         Gradle can still compile, but the APK would show a blank screen.')
    logger.warn('         Run `npm run android:prepare` from the project root to build and copy the web assets.')
    logger.warn('')
}

// =============================================================================
// Standard Capacitor project layout (unchanged below this line).
// =============================================================================
include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'
